name: Build DITZ store

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ditz_store
          POSTGRES_USER: ditz
          POSTGRES_PASSWORD: ditz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ditz -d ditz_store"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://ditz:ditz@127.0.0.1:5432/ditz_store?schema=public
      SESSION_SECRET: ci-only-random-test-secret-long-enough-for-local-validation
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate the database client
        run: npm run db:generate
      - name: Validate the PostgreSQL schema
        run: npm run db:validate
      - name: Apply database migrations
        run: npm run db:migrate:deploy
      - name: Seed example catalogue
        run: npm run db:seed
      - name: Run storefront pricing tests
        run: npm test
      - name: Check API and seed syntax
        run: npm run check:server
      - name: Build the storefront
        run: npm run build
